<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비상교육 교강사 지원 챗봇</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <style>
    /* CSS는 기존과 동일하게 유지 (디자인 일관성) */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #1a56db; --primary-light: #e8f0fe; --primary-dark: #1240a8;
      --accent: #ff6b35; --success: #16a34a; --bg: #f4f6fb; --white: #ffffff;
      --gray-100: #f3f4f6; --gray-200: #e5e7eb; --gray-400: #9ca3af;
      --gray-600: #4b5563; --gray-800: #1f2937; --bot-bg: #f0f4ff;
      --user-bg: #1a56db; --shadow: 0 4px 24px rgba(26,86,219,0.10);
      --radius: 16px; --radius-sm: 8px;
    }
    body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--gray-800); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: linear-gradient(135deg, #1240a8 0%, #1a56db 60%, #2563eb 100%); color: white; padding: 0 24px; height: 64px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 12px rgba(18,64,168,0.20); position: sticky; top: 0; z-index: 100; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo { width: 38px; height: 38px; background: rgba(255,255,255,0.18); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .header-title { font-size: 17px; font-weight: 700; }
    .header-badge { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 4px 12px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
    .badge-dot { width: 7px; height: 7px; background: #4ade80; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .app-container { flex: 1; max-width: 820px; width: 100%; margin: 24px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 16px; }
    .info-banner { background: white; border-radius: var(--radius); padding: 18px 22px; box-shadow: var(--shadow); display: flex; align-items: flex-start; gap: 14px; border-left: 4px solid var(--primary); }
    .info-text h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: var(--primary); }
    .info-text p { font-size: 13px; color: var(--gray-600); line-height: 1.6; }
    .service-tags { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .service-tag { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .tag-vivasam { background: #e0f2fe; color: #0369a1; }
    .tag-book { background: #f0fdf4; color: #15803d; }
    .tag-sconn { background: #fff7ed; color: #c2410c; }
    .chat-window { background: white; border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; height: 520px; overflow: hidden; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .msg-row { display: flex; gap: 10px; animation: fadeIn 0.3s ease; }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .bot-avatar { background: linear-gradient(135deg, #1a56db, #2563eb); color: white; }
    .user-avatar { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
    .msg-content { max-width: 75%; display: flex; flex-direction: column; gap: 4px; }
    .msg-row.user .msg-content { align-items: flex-end; }
    .msg-bubble { padding: 12px 16px; border-radius: var(--radius); font-size: 14px; line-height: 1.7; word-break: break-word; }
    .bot-bubble { background: var(--bot-bg); color: var(--gray-800); border-bottom-left-radius: 4px; }
    .user-bubble { background: var(--user-bg); color: white; border-bottom-right-radius: 4px; }
    .quick-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .quick-btn { background: white; border: 1.5px solid var(--primary); color: var(--primary); border-radius: 20px; padding: 5px 14px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
    .quick-btn:hover { background: var(--primary); color: white; }
    .chat-input-area { border-top: 1px solid var(--gray-200); padding: 14px 16px; background: white; }
    .input-row { display: flex; gap: 10px; align-items: flex-end; }
    .msg-input { flex: 1; border: 1.5px solid var(--gray-200); border-radius: 12px; padding: 10px 14px; font-size: 14px; resize: none; outline: none; min-height: 44px; max-height: 120px; }
    .send-btn { width: 44px; height: 44px; background: var(--primary); color: white; border: none; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .send-btn:disabled { background: var(--gray-200); cursor: not-allowed; }
    footer { text-align: center; padding: 16px; font-size: 12px; color: var(--gray-400); }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-logo">📚</div>
    <div>
      <div class="header-title">비상교육 교강사 지원 챗봇</div>
    </div>
  </div>
  <div style="display:flex; align-items:center; gap:10px;">
    <a href="admin.html" style="background:rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.35); border-radius:8px; padding:5px 11px; color:white; text-decoration:none; font-size:12px;">
      <i class="fa fa-gear"></i> 관리자
    </a>
    <div class="header-badge"><div class="badge-dot"></div>AI 응답 중</div>
  </div>
</header>

<div class="app-container">
  <div class="info-banner">
    <div class="info-icon">💬</div>
    <div class="info-text">
      <h3>비상교육 교강사 전용 AI 상담 서비스</h3>
      <p>비바샘, 비상교재, 스콘 이용 관련 문의를 AI가 분석하여 답변해 드립니다.</p>
      <div class="service-tags">
        <span class="service-tag tag-vivasam">📖 비바샘</span>
        <span class="service-tag tag-book">🏫 비상교재</span>
        <span class="service-tag tag-sconn">📱 스콘</span>
      </div>
    </div>
  </div>

  <div class="chat-window">
    <div class="chat-messages" id="chatMessages">
      <div class="msg-row">
        <div class="msg-avatar bot-avatar"><i class="fa fa-robot"></i></div>
        <div class="msg-content">
          <div class="msg-bubble bot-bubble">안녕하세요, 선생님! 무엇을 도와드릴까요?</div>
          <div class="quick-btns">
            <button class="quick-btn" onclick="sendQuick('비바샘 교사용 PDF 자료 받는 법')">📄 교사용 PDF 받기</button>
            <button class="quick-btn" onclick="sendQuick('스콘 e-Book 신청 방법')">📱 e-Book 신청</button>
            <button class="quick-btn" onclick="sendQuick('스콘 로그인이 안 돼요')">🔒 로그인 오류</button>
          </div>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <div class="input-row">
        <textarea class="msg-input" id="msgInput" placeholder="문의 내용을 입력하세요..." rows="1" onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="fa fa-paper-plane"></i></button>
      </div>
    </div>
  </div>
</div>

<footer>© 2025 비상교육 · Powered by Gemini AI</footer>

<script>
// ═══════════════════════════════════════════
//  보안 설정 (리퍼러 제한 필수 적용)
// ═══════════════════════════════════════════
const GEMINI_API_KEY = 'AIzaSyASxJIuWmIV6od9ueLlr3TZBjPe7KAbXXo';
const API_BASE = 'https://www.genspark.ai/api/code_sandbox_light/preview/0b8c60ae-258c-4dee-a4a9-c03cd18e338b';

// 대화 내역 저장
let conversationHistory = [];

// 1. 초기 데이터 로드 (교재 목록 등)
async function loadDB() {
  try {
    const res = await fetch(`${API_BASE}/tables/textbooks?limit=500`);
    const data = await res.json();
    return data.data || [];
  } catch(e) { console.error("DB 로드 실패", e); return []; }
}

// 2. AI 호출 함수 (보안 에러 처리 강화)
async function callGemini(text) {
  const textbooks = await loadDB();
  const textbookInfo = textbooks.map(t => `- ${t.brand} (${t.grade} ${t.subject}): ${t.registered ? '자료 있음' : '자료 없음'}`).join('\n');

  const systemPrompt = `당신은 비상교육 상담봇입니다. 다음 정보를 기반으로 친절히 답하세요.\n[교재현황]\n${textbookInfo}\n[규칙] 1.한국어로만 답변 2.링크는 정확히 안내 3.모르는 교재는 없다고 정직하게 말하기`;

  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
  
  const body = {
    contents: [
      { role: "user", parts: [{ text: systemPrompt }] },
      { role: "model", parts: [{ text: "네, 숙지했습니다." }] },
      ...conversationHistory,
      { role: "user", parts: [{ text }] }
    ]
  };

  const response = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  if (response.status === 403) {
    return "⚠️ [보안 오류] 허용되지 않은 사이트에서 접근했습니다. 관리자 설정(리퍼러 제한)을 확인해 주세요.";
  }
  
  if (!response.ok) {
    const err = await response.json();
    throw new Error(err.error?.message || "알 수 없는 오류");
  }

  const result = await response.json();
  return result.candidates[0].content.parts[0].text;
}

// 3. 메시지 전송 로직
async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text) return;

  input.value = '';
  appendMsg('user', text);
  
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  try {
    const answer = await callGemini(text);
    appendMsg('bot', answer);
    conversationHistory.push({ role: "user", parts: [{ text }] });
    conversationHistory.push({ role: "model", parts: [{ text: answer }] });
  } catch (e) {
    appendMsg('bot', "죄송합니다. 오류가 발생했습니다: " + e.message);
  } finally {
    sendBtn.disabled = false;
  }
}

function appendMsg(role, text) {
  const container = document.getElementById('chatMessages');
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  row.innerHTML = `
    <div class="msg-avatar ${role}-avatar"><i class="fa fa-${role==='bot'?'robot':'user'}"></i></div>
    <div class="msg-content">
      <div class="msg-bubble ${role}-bubble">${text.replace(/\n/g, '<br>')}</div>
    </div>`;
  container.appendChild(row);
  container.scrollTop = container.scrollHeight;
}

function handleKey(e) { if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function sendQuick(text) { document.getElementById('msgInput').value = text; sendMessage(); }
</script>
</body>
</html>
